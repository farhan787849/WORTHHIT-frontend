<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORTHHIT - Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo" onclick="showSection('home')">
    <span>WORTH</span><b>HIT</b>
  </div>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search products...">
  </div>

  <div class="head-actions">
    <button onclick="showSection('home')">🏠 Home</button>
    <button onclick="showSection('orders')">📦 Orders</button>
    <button onclick="showSection('cart')">
      🛒 Cart <b id="cartCount">0</b>
    </button>
    <button id="accountBtn" onclick="showSection('account')">
      👤 Account
    </button>
  </div>
</header>


<main>

  <!-- HOME -->
  <section id="home" class="section active">

    <div class="hero">
      <div>
        <p class="hero-small">WELCOME TO</p>
        <h1>WORTHHIT</h1>
        <p>Smart products. Great prices. Delivered to your door.</p>
        <button class="checkout" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
          Shop Now
        </button>
      </div>
    </div>

    <div class="container">

      <h2>Shop by Category</h2>

      <div id="categories" class="cats">
        <button class="active" onclick="filterCat('')">All</button>
      </div>

      <div class="section-title">
        <h2>Featured Products</h2>
      </div>

      <div id="products" class="products">
        <div class="empty">Loading products...</div>
      </div>

    </div>
  </section>


  <!-- CART -->
  <section id="cart" class="section">
    <div class="container">

      <div class="page-head">
        <button onclick="showSection('home')">← Continue Shopping</button>
        <h1>🛒 Your Cart</h1>
      </div>

      <div id="cartBox">
        <div class="empty">Loading cart...</div>
      </div>

    </div>
  </section>


  <!-- ORDERS -->
  <section id="orders" class="section">
    <div class="container">

      <div class="page-head">
        <button onclick="showSection('home')">← Home</button>
        <h1>📦 My Orders</h1>
      </div>

      <div id="ordersBox">
        <div class="empty">Loading orders...</div>
      </div>

    </div>
  </section>


  <!-- ACCOUNT -->
  <section id    <section id="orders" class="section">
      <div class="section-head"><h2>My Orders</h2><button onclick="showSection('account')">Account</button></div>
      <div id="ordersBox"></div>
    </section>

    <section id="account" class="section">
      <div class="account-card">
        <h2 id="accountTitle">Account</h2>
        <div id="accountBox"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast"></div>

  <footer>© <span id="year"></span> WORTHHIT. All rights reserved.</footer>
  <script src="app.js"></script>
</body>
</html>
