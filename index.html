<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WORTHHIT — Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">WORTH<span>HIT</span></div>
    <div class="search-wrap"><input id="search" placeholder="Search products..." autocomplete="off" oninput="renderProducts()" onkeydown="if(event.key==='Enter') renderProducts()"><button onclick="renderProducts()">🔎</button><div id="searchResults" class="search-results"></div></div>
    <div class="head-actions">
      <button onclick="showSection('home')">🏠 Home</button>
      <button onclick="showSection('orders')">📦 Orders</button>
      <button onclick="showSection('cart')">🛒 Cart <b id="cartCount">0</b></button>
      <button id="accountBtn" onclick="showSection('account')">👤 Account</button>
    </div>
  </header>

  <nav class="cats" id="categories"></nav>

  <main>
    <section id="home" class="section active">
      <div class="hero">
        <div><p class="eyebrow">WELCOME TO WORTHHIT</p><h1>Shop smart.<br>Shop <span>WORTHHIT.</span></h1><p>Quality products at prices worth hitting.</p><button class="primary" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button></div>
        <div class="hero-icon">🛍️</div>
      </div>
      <div class="section-head"><h2>Featured Products</h2><button onclick="loadProducts()">Refresh</button></div>
      <div id="products" class="grid"></div>
    </section>

    <section id="cart" class="section">
      <div class="section-head"><h2>Your Cart</h2><button onclick="showSection('home')">Continue shopping</button></div>
      <div id="cartBox"></div>
    </section>

    <section id="orders" class="section">
      <div class="section-head"><h2>My Orders</h2><button onclick="showSection('home')">Home</button><button onclick="showSection('account')">Account</button></div>
      <div id="ordersBox"></div>
    </section>

    <section id="account" class="section">
      <div class="section-head"><h2>Account</h2><button onclick="showSection('home')">🏠 Home</button></div>
      <div class="account-card">
        <div id="accountBox"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
  <div id="toast" class="toast"></div>

  <footer>© <span id="year"></span> WORTHHIT. All rights reserved.</footer>
  <script src="app.js"></script>
</body>
</html>
