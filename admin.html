<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORTHHIT ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:#f6f7fb;color:#17131d}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;border-radius:12px;padding:11px 16px;background:#eeeef5;color:#17131d}
button.primary{background:#6d28d9;color:#fff}
button.danger{background:#fee2e2;color:#991b1b}
button.small{padding:7px 10px;font-size:14px}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:28px;font-weight:700;cursor:pointer}
.logo b{color:#6d28d9}
.header-right{display:flex;gap:8px;flex-wrap:wrap}
.container{max-width:1200px;margin:auto;padding:24px}
.login{max-width:430px;margin:70px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 30px #0001}
.form{display:grid;gap:12px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d7d7df;border-radius:10px;background:#fff}
textarea{min-height:90px;resize:vertical}
.hidden{display:none!important}
h1{margin:5px 0 20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.card{background:#fff;border:1px solid #e2e2e8;border-radius:18px;padding:20px}
.card .label{color:#666;font-size:15px}
.card .value{font-size:31px;font-weight:700;margin-top:12px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nav button.active{background:#6d28d9;color:#fff}
.panel{background:#fff;border:1px solid #e2e2e8;border-radius:18px;padding:20px;margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}
th{background:#fafafa}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:13px}
.status{padding:7px;border-radius:8px;border:1px solid #ddd}
.product-img{width:55px;height:55px;object-fit:cover;border-radius:10px;background:#eee}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:35px;color:#777}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:#fff;border-radius:20px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.message{padding:10px;border-radius:10px;background:#f1f5f9;margin-bottom:12px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.order-card{border:1px solid #eee;border-radius:14px;padding:15px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.footer{text-align:center;color:#777;padding:30px}
@media(max-width:800px){
 .cards{grid-template-columns:1fr 1fr}
 .container{padding:14px}
 .logo{font-size:23px}
}
@media(max-width:520px){
 .cards{grid-template-columns:1fr 1fr}
 .grid2{grid-template-columns:1fr}
 .header{padding:12px}
}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <div class="logo">WORTH<span>HIT</span> <b>ADMIN</b></div>
  <p>Admin login</p>
  <div id="loginMsg"></div>
  <form class="form" onsubmit="login(event)">
    <input id="username" placeholder="Username" value="admin" required>
    <input id="password" type="password" placeholder="Password" required>
    <button class="primary">Login</button>
  </form>
</div>

<div id="app" class="hidden">
<header class="header">
  <div class="logo" onclick="go('dashboard')">WORTH<span>HIT</span> <b>ADMIN</b></div>
  <div class="header-right">
    <button onclick="openStore()">🛍️ Store</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<main class="container">
  <div class="nav">
    <button id="nav-dashboard" class="active" onclick="go('dashboard')">📊 Dashboard</button>
    <button id="nav-products" onclick="go('products')">🛍️ Products</button>
    <button id="nav-orders" onclick="go('orders')">📦 Orders</button>
    <button id="nav-customers" onclick="go('customers')">👥 Customers</button>
    <button id="nav-sales" onclick="go('sales')">💰 Sales</button>
  </div>

  <section id="dashboard" class="page">
    <h1>Admin Dashboard</h1>
    <div class="cards">
      <div class="card"><div class="label">Products</div><div class="value" id="statProducts">0</div></div>
      <div class="card"><div class="label">Orders</div><div class="value" id="statOrders">0</div></div>
      <div class="card"><div class="label">Customers</div><div class="value" id="statCustomers">0</div></div>
      <div class="card"><div class="label">Sales</div><div class="value" id="statSales">₹0</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Recent Orders</h2><button onclick="go('orders')">View all</button></div>
      <div id="recentOrders"></div>
    </div>
  </section>

  <section id="products" class="page hidden">
    <div class="panel-head"><h1>Products</h1><button class="primary" onclick="openProduct()">➕ Add Product</button></div>
    <div class="panel">
      <div id="productsTable"></div>
    </div>
  </section>

  <section id="orders" class="page hidden">
    <h1>Orders</h1>
    <div class="panel">
      <div id="ordersTable"></div>
    </div>
  </section>

  <section id="customers" class="page hidden">
    <h1>Customers</h1>
    <div class="panel">
      <div id="customersTable"></div>
    </div>
  </section>

  <section id="sales" class="page hidden">
    <h1>Sales</h1>
    <div class="cards">
      <div class="card"><div class="label">Total Sales</div><div class="value" id="salesTotal">₹0</div></div>
      <div class="card"><div class="label">Total Orders</div><div class="value" id="salesOrders">0</div></div>
      <div class="card"><div class="label">Average Order</div><div class="value" id="salesAverage">₹0</div></div>
      <div class="card"><div class="label">Delivered</div><div class="value" id="salesDelivered">0</div></div>
    </div>
    <div class="panel">
      <h2>Sales Orders</h2>
      <div id="salesTable"></div>
    </div>
  </section>
</main>

<div class="footer">WORTHHIT Admin Panel</div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Product</h2>
      <button onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const API="https://worthhit-api.onrender.com";
let token=localStorage.getItem("worthhit_admin_token")||"";
let products=[],orders=[],categories=[];

const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function api(path,options={}){
  const headers={"Content-Type":"application/json",...(options.headers||{})};
  if(token) headers.Authorization="Bearer "+token;
  const r=await fetch(API+path,{...options,headers});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||"Request failed");
  return d;
}

function msg(text,type="message"){
  return `<div class="message ${type}">${esc(text)}</div>`;
}

async function login(e){
  e.preventDefault();
  $("loginMsg").innerHTML="";
  try{
    const d=await api("/api/admin/login",{method:"POST",body:JSON.stringify({
      username:$("username").value.trim(),
      password:$("password").value
    })});
    token=d.token;
    localStorage.setItem("worthhit_admin_token",token);
    $("loginPage").classList.add("hidden");
    $("app").classList.remove("hidden");
    await loadAll();
  }catch(err){
    $("loginMsg").innerHTML=msg(err.message,"error");
  }
}

async function loadAll(){
  try{
    [products,orders,categories]=await Promise.all([
      api("/api/products"),
      api("/api/orders"),
      api("/api/categories")
    ]);
    renderDashboard();
    renderProducts();
    renderOrders();
    renderCustomers();
    renderSales();
  }catch(err){
    if(err.message.includes("Admin login")) logout();
    else alert(err.message);
  }
}

function go(page){
  document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
  $(page).classList.remove("hidden");
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  $("nav-"+page).classList.add("active");
  if(page==="dashboard") renderDashboard();
  if(page==="products") renderProducts();
  if(page==="orders") renderOrders();
  if(page==="customers") renderCustomers();
  if(page==="sales") renderSales();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderDashboard(){
  $("statProducts").textContent=products.length;
  $("statOrders").textContent=orders.length;
  const phones=new Set(orders.map(o=>o.phone).filter(Boolean));
  $("statCustomers").textContent=phones.size;
  const sales=orders.filter(o=>o.status!=="Cancelled").reduce((a,o)=>a+Number(o.amount||0),0);
  $("statSales").textContent=money(sales);

  const recent=orders.slice(0,5);
  $("recentOrders").innerHTML=recent.length?recent.map(orderHTML).join(""):'<div class="empty">No orders yet.</div>';
}

function orderHTML(o){
  return `<div class="order-card">
    <b>Order #${o.id}</b> · ${money(o.amount)}
    <span class="badge">${esc(o.status)}</span>
    <p><b>${esc(o.customer)}</b> · ${esc(o.phone)}</p>
    <small>${esc(o.address)}<br>${esc(o.created_at)}</small>
  </div>`;
}

function renderProducts(){
  $("productsTable").innerHTML=products.length?`
  <div class="table-wrap"><table>
    <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr></thead>
    <tbody>${products.map(p=>`
      <tr>
        <td>${p.image?`<img class="product-img" src="${p.image.startsWith("http")?p.image:API+p.image}" onerror="this.style.display='none'">`:"—"}</td>
        <td><b>${esc(p.name)}</b><br><small>ID: ${p.id}</small></td>
        <td>${money(p.price)}<br><small>${p.old_price?money(p.old_price):""}</small></td>
        <td>${p.stock}</td>
        <td>${esc(p.category)}</td>
        <td><div class="actions">
          <button class="small" onclick="openProduct(${p.id})">✏️ Edit</button>
          <button class="small danger" onclick="deleteProduct(${p.id})">🗑️ Delete</button>
        </div></td>
      </tr>`).join("")}</tbody>
  </table></div>`:'<div class="empty">No products.</div>';
}

function openProduct(id=null){
  const p=id?products.find(x=>x.id===id):null;
  $("modalTitle").textContent=p?"Edit Product":"Add Product";
  $("modalBody").innerHTML=`
    <form class="form" onsubmit="saveProduct(event,${id||"null"})">
      <input id="pname" placeholder="Product name" value="${esc(p?.name||"")}" required>
      <select id="pcategory" required>
        ${categories.map(c=>`<option ${p?.category===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}
      </select>
      <div class="grid2">
        <input id="pprice" type="number" min="0" placeholder="Price" value="${p?.price??""}" required>
        <input id="pold" type="number" min="0" placeholder="Old price" value="${p?.old_price??0}">
      </div>
      <input id="pstock" type="number" min="0" placeholder="Stock" value="${p?.stock??0}">
      <input id="pimage" placeholder="Image URL (optional)" value="${esc(p?.image||"")}">
      <button type="button" onclick="uploadProductImage()">🖼️ Upload Image</button>
      <button class="primary">Save Product</button>
    </form>`;
  $("modal").classList.remove("hidden");
}

async function uploadProductImage(){
  const input=document.createElement("input");
  input.type="file"; input.accept="image/*";
  input.onchange=async()=>{
    if(!input.files[0]) return;
    const fd=new FormData();
    fd.append("image",input.files[0]);
    try{
      const r=await fetch(API+"/api/admin/upload",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||"Upload failed");
      $("pimage").value=d.url;
      alert("Image uploaded");
    }catch(e){alert(e.message)}
  };
  input.click();
}

async function saveProduct(e,id){
  e.preventDefault();
  const body={
    name:$("pname").value.trim(),
    category:$("pcategory").value,
    price:Number($("pprice").value),
    old_price:Number($("pold").value||0),
    stock:Number($("pstock").value||0),
    image:$("pimage").value.trim()
  };
  try{
    if(id) await api("/api/products/"+id,{method:"PUT",body:JSON.stringify(body)});
    else await api("/api/products",{method:"POST",body:JSON.stringify(body)});
    closeModal(); await loadAll(); go("products");
  }catch(e){alert(e.message)}
}

async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  try{await api("/api/products/"+id,{method:"DELETE"});await loadAll();go("products")}
  catch(e){alert(e.message)}
}

function renderOrders(){
  $("ordersTable").innerHTML=orders.length?`
  <div class="table-wrap"><table>
    <thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Address</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${orders.map(o=>`
      <tr>
        <td><b>#${o.id}</b></td>
        <td>${esc(o.customer)}<br>${esc(o.phone)}</td>
        <td>${money(o.amount)}</td>
        <td>${esc(o.address)}</td>
        <td><select class="status" onchange="changeStatus(${o.id},this.value)">
          ${["Processing","Confirmed","Packed","Shipped","Delivered","Cancelled","Payment Pending","Payment Failed"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
        </select></td>
        <td>${esc(o.created_at)}</td>
      </tr>`).join("")}</tbody>
  </table></div>`:'<div class="empty">No orders yet.</div>';
}

async function changeStatus(id,status){
  try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({status})});await loadAll()}
  catch(e){alert(e.message);await loadAll()}
}

function renderCustomers(){
  const map=new Map();
  orders.forEach(o=>{
    if(o.phone && !map.has(o.phone)) map.set(o.phone,o);
  });
  const customers=[...map.values()];
  $("customersTable").innerHTML=customers.length?`
  <div class="table-wrap"><table>
    <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Orders</th><th>Total Spent</th></tr></thead>
    <tbody>${customers.map(c=>{
      const os=orders.filter(o=>o.phone===c.phone && o.status!=="Cancelled");
      const total=os.reduce((a,o)=>a+Number(o.amount||0),0);
      return `<tr><td><b>${esc(c.customer)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td>${os.length}</td><td>${money(total)}</td></tr>`;
    }).join("")}</tbody>
  </table></div>`:'<div class="empty">Customers with orders will appear here.</div>';
}

function renderSales(){
  const valid=orders.filter(o=>o.status!=="Cancelled");
  const total=valid.reduce((a,o)=>a+Number(o.amount||0),0);
  $("salesTotal").textContent=money(total);
  $("salesOrders").textContent=valid.length;
  $("salesAverage").textContent=money(valid.length?total/valid.length:0);
  $("salesDelivered").textContent=orders.filter(o=>o.status==="Delivered").length;

  $("salesTable").innerHTML=valid.length?`
  <div class="table-wrap"><table>
    <thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${valid.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer)}<br>${esc(o.phone)}</td><td>${money(o.amount)}</td><td>${esc(o.status)}</td><td>${esc(o.created_at)}</td></tr>`).join("")}</tbody>
  </table></div>`:'<div class="empty">No sales yet.</div>';
}

function closeModal(){$("modal").classList.add("hidden")}
function openStore(){location.href="https://worthhit-frontend.onrender.com"}
async function logout(){
  try{if(token) await api("/api/admin/logout",{method:"POST"})}catch(e){}
  token="";localStorage.removeItem("worthhit_admin_token");
  $("app").classList.add("hidden");$("loginPage").classList.remove("hidden");
}

if(token){
  $("loginPage").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadAll();
}
</script>
</body>
</html>
